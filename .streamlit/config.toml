# The dashboard injects its own "Bloom" CSS; this theme only styles Streamlit's
# own chrome (widgets, spinner) to match. Server/browser settings suit hosting.
[theme]
base = "light"
primaryColor = "#897eb0"
backgroundColor = "#f1eef6"
secondaryBackgroundColor = "#ffffff"
textColor = "#2d293a"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
